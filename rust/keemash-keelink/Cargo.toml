[package]
name = "keemash-keelink"
version = "0.9.2"
edition = "2021"
license = "GPL-2.0-only"
description = "KeeLink v1 and KeeLink Fabric v2 codecs for KeeMASH"

[lib]
path = "src/lib.rs"

[dependencies]
prost = "0.14"
uuid = { version = "1", features = ["v5", "v7"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
hex = "0.4"
