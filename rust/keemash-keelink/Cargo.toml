[package]
name = "keemash-keelink"
version = "0.10.0"
edition = "2021"
license = "GPL-2.0-only"
description = "KeeLink v1 and KeeLink Fabric v2 codecs for KeeMASH"

[lib]
path = "src/lib.rs"

[dependencies]
crc32fast = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
prost = "0.14"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v5", "v7"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
